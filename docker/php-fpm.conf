[www]
; Run as root inside the container — Docker containers are already isolated
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = root
listen.group = root

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Clear environment so PHP inherits all env vars (APP_KEY, DB_*, etc)
clear_env = no

; Log to stderr so Railway can capture it
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
